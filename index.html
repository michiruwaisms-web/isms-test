<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ISMS テスト</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --danger: #dc2626;
      --text-main: #111827;
      --text-sub: #6b7280;
      --border: #e5e7eb;
      --radius-lg: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text-main);
    }
    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      margin-top: 16px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    h2 { font-size: 1.1rem; margin: 0 0 8px; }
    p  { margin: 0 0 8px; color: var(--text-sub); line-height: 1.6; }

    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-secondary {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .header-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
    }
    .badge-name {
      border-radius: 999px;
      padding: 2px 8px;
      background: #ecfdf5;
      color: #15803d;
      font-size: 0.75rem;
    }
    .badge-attempt {
      border-radius: 999px;
      padding: 2px 8px;
      background: #eef2ff;
      color: #4f46e5;
      font-size: 0.75rem;
    }

    .info-sub {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .history-box {
      background: #f9fafb;
      border-radius: 8px;
      padding: 8px;
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    #progress-area { margin-top: 8px; margin-bottom: 8px; }
    .progress-text {
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: var(--text-main);
    }
    .progress-bar {
      width: 100%;
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 4px;
    }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.3s;
    }

    .question-card {
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 12px;
      margin-top: 10px;
      background: #ffffff;
    }
    .question-title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 6px;
    }

    .options { margin-top: 4px; }
    .option-item {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 2px 0;
      font-size: 0.9rem;
    }
    /* ===============================
   🌟 カスタムメッセージモーダル
   =============================== */
.msg-modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.msg-modal {
  background: #fff;
  width: 90%;
  max-width: 380px;
  border-radius: 14px;
  padding: 20px 24px;
  text-align: center;
  box-shadow: 0 12px 32px rgba(0,0,0,0.18);
  animation: fadeIn 0.2s ease;
}

.msg-title {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 8px;
}

.msg-body {
  font-size: 0.95rem;
  margin: 10px 0 18px;
  color: #374151;
  line-height: 1.55;
}

.msg-btn {
  background: #2563eb;
  padding: 10px 0;
  border-radius: 8px;
  border: none;
  color: #fff;
  width: 100%;
  font-size: 1rem;
  cursor: pointer;
}


  </style>
</head>
<body>
  <div class="page">

    <!-- ユーザー情報入力 -->
    <div class="card" id="user-card">
      <h1>ISMS テスト</h1>
      <p>氏名と所属を入力してください。</p>

      <div class="field">
        <label for="name">氏名</label>
        <input type="text" id="name" />
      </div>

      <div class="field">
        <label for="department">所属</label>
        <input type="text" id="department" />
      </div>

      <div class="btn-row">
        <button class="btn-primary" id="start-btn">テスト開始</button>
        <button class="btn-secondary" id="clear-btn">データ削除</button>
      </div>
    </div>

    <!-- テスト画面 -->
    <div class="card" id="test-card" style="display:none;">
      <div class="header-row">
        <div>
          <span class="badge-name" id="header-name"></span>
          <span class="badge-attempt" id="header-attempt"></span>
          <div class="info-sub" id="header-dept"></div>
        </div>
        <div class="history-box" id="history-area" style="display:none;"></div>
      </div>

      <div id="progress-area" style="display:none;">
        <div class="progress-text" id="progress-text"></div>
        <div class="progress-bar">
          <div id="progress-fill"></div>
        </div>
      </div>

      <div id="question-area"></div>

      <div class="btn-row">
        <button class="btn-secondary" id="back-btn" style="display:none;">戻る</button>
        <button class="btn-primary" id="next-btn">次へ</button>
      </div>

      <div id="result-area"></div>
    </div>
<script>
/******************************************************
 * 設定
 ******************************************************/
const GAS_URL = "https://script.google.com/macros/s/AKfycbzEqB9GgJYfUCkXeAP4xJQBCF7o_JENIWTgA6dx7SfHjyabt9NqMDDEMFs0zWEFh4Pa/exec";

/******************************************************
 * 状態変数
 ******************************************************/
let allQuestions = [];        // 全問題
let totalQuestions = 0;       // 全問題数（固定）
let currentRoundQuestions = []; // 今ラウンドの出題セット
let currentIndex = 0;         // 今ラウンド内の進行
let globalProgress = 0;       // 累計 Progress 用

// 回答保存
// answers[q.id] = ["1","3"] のような形式で保存
let answers = {};       

let userInfo = null;          // { name, department, attempt, history[] }

/******************************************************
 * 初期化
 ******************************************************/
document.addEventListener("DOMContentLoaded", () => {
  loadUserInfo();

  document.getElementById("start-btn").onclick = onStart;
  document.getElementById("clear-btn").onclick = onClear;

  document.getElementById("next-btn").onclick = onNext;
  document.getElementById("back-btn").onclick = onBack;
});

/******************************************************
 * localStorage 読み込み
 ******************************************************/
function loadUserInfo() {
  const raw = localStorage.getItem("ismsUser");

  // 壊れたデータの場合は初期化
  if (!raw || raw === "undefined" || raw === "{}") {
    localStorage.removeItem("ismsUser");
    userInfo = null;
    return;
  }

  try {
    userInfo = JSON.parse(raw);

    // attempt が壊れていたら修正
    if (!userInfo.attempt || isNaN(userInfo.attempt)) userInfo.attempt = 1;
    if (!Array.isArray(userInfo.history)) userInfo.history = [];

    document.getElementById("name").value = userInfo.name || "";
    document.getElementById("department").value = userInfo.department || "";

  } catch (e) {
    userInfo = null;
  }
}

function saveUserInfo() {
  if (!userInfo) return;
  localStorage.setItem("ismsUser", JSON.stringify(userInfo));
}

/******************************************************
 * データ削除
 ******************************************************/
function onClear() {
  showConfirm(
    "確認",
    "端末に保存されたテストデータを削除しますか？",
    () => {
      // OK時の処理
      localStorage.removeItem("ismsUser");
      userInfo = null;
      location.reload();
    }
  );
}

/******************************************************
 * テスト開始
 ******************************************************/
async function onStart() {
  const name = document.getElementById("name").value.trim();
  const dept = document.getElementById("department").value.trim();

if (!name || !dept) {
    showMessage("入力が必要です", "氏名と所属の両方を入力してください。");
    return;
}

  if (!userInfo) {
    userInfo = {
      name,
      department: dept,
      attempt: 1,
      history: []
    };
  } else {
    userInfo.name = name;
    userInfo.department = dept;
    if (!Array.isArray(userInfo.history)) userInfo.history = [];
  }
  saveUserInfo();

  // 問題取得
  try {
    allQuestions = await fetchQuestions();
    totalQuestions = allQuestions.length;
  } catch (e) {
    showMessage("エラー", "問題の取得に失敗しました。もう一度お試しください。");
    console.error(e);
    return;
  }

  globalProgress = 0;
  answers = {}; // 回答初期化

  // 第一ラウンド開始（全問題）
  startRound(allQuestions);

  // 画面切り替え
  document.getElementById("user-card").style.display = "none";
  document.getElementById("test-card").style.display = "block";

  document.getElementById("header-name").textContent = userInfo.name;
  document.getElementById("header-dept").textContent = userInfo.department;
  document.getElementById("header-attempt").textContent =
    `第 ${userInfo.attempt} 回`;

  renderHistory();
}

/******************************************************
 * 問題取得
 ******************************************************/
async function fetchQuestions() {
  const res = await fetch(GAS_URL + "?questions=1");
  if (!res.ok) throw new Error("Failed fetch");
  const qs = await res.json();

  // answers は必ず文字列配列に統一
  qs.forEach(q => {
    q.answers = (q.answers || []).map(a => String(a));
  });

  return qs;
}

/******************************************************
 * ラウンド開始（全問題 or 誤答問題）
 ******************************************************/
function startRound(list) {
  currentRoundQuestions = list.slice(); // 参照切り離し
  currentIndex = 0;

  document.getElementById("progress-area").style.display = "block";
  document.getElementById("result-area").innerHTML = "";
  document.getElementById("back-btn").style.display = "none"; // 最初は戻る非表示

  renderQuestion();
  updateProgressBar();
}

/******************************************************
 * 問題表示
 ******************************************************/
function renderQuestion() {
  const q = currentRoundQuestions[currentIndex];
  const area = document.getElementById("question-area");

  area.innerHTML = "";

  const card = document.createElement("div");
  card.className = "question-card";

  const num = allQuestions.findIndex(x => String(x.id) === String(q.id)) + 1;

  const title = document.createElement("div");
  title.className = "question-title";
  title.textContent = `Q${num}. ${q.question}`;

  const opts = document.createElement("div");
  opts.className = "options";

  const group = "q_" + q.id;

  q.options.forEach((opt, i) => {
    const line = document.createElement("div");
    line.className = "option-item";

    const input = document.createElement("input");
    input.type = q.type === "multi" ? "checkbox" : "radio";
    input.name = group;
    input.value = String(i + 1);

    if (answers[q.id] && answers[q.id].includes(String(i + 1))) {
      input.checked = true;
    }

    const label = document.createElement("label");
    label.textContent = opt;

    line.appendChild(input);
    line.appendChild(label);
    opts.appendChild(line);
  });

  card.appendChild(title);
  card.appendChild(opts);
  area.appendChild(card);

  // ---- 戻るボタン表示 ----
  document.getElementById("back-btn").style.display =
    currentIndex > 0 ? "inline-flex" : "none";

  // ---- 次へ / 採点 切り替え ----
  const nextBtn = document.getElementById("next-btn");
  if (currentIndex >= currentRoundQuestions.length - 1) {
    nextBtn.textContent = "採点";
    nextBtn.onclick = finalizeRound;
  } else {
    nextBtn.textContent = "次へ";
    nextBtn.onclick = onNext;
  }
}


/******************************************************
 * 次へ
 ******************************************************/
function onNext() {
  const q = currentRoundQuestions[currentIndex];
  const group = "q_" + q.id;
  const nodes = document.getElementsByName(group);

  const selected = [];
  nodes.forEach(n => {
    if (n.checked) selected.push(n.value);
  });

if (selected.length === 0) {
    showMessage("ご確認ください", "少なくとも 1 つ選択してください。");
    return;
}

  // ★ 回答を保存（戻るで戻った時に再現するため）
  answers[q.id] = selected.slice();

  // 累計進捗を増やす（初回ラウンド分のみ）
  if (!q.answeredOnce) {
    globalProgress++;
    q.answeredOnce = true;
  }

  // 最後の問題なら採点へ
  //if (currentIndex >= currentRoundQuestions.length - 1) {
  //  finalizeRound();
  //  return;
  // }

  // 次の問題へ
  currentIndex++;
  renderQuestion();
  updateProgressBar();
}

/******************************************************
 * 戻る
 ******************************************************/
function onBack() {
  if (currentIndex <= 0) return;

  currentIndex--;
  renderQuestion();
  updateProgressBar();
}

/******************************************************
 * 累計プログレスバー
 ******************************************************/
function updateProgressBar() {
  const total = currentRoundQuestions.length;   // ← 今ラウンドの問題数（初回10、再テスト3など）
  const done  = Math.min(currentIndex + 1, total);

  const percent = Math.floor((done / total) * 100);
  document.getElementById("progress-fill").style.width = percent + "%";

  document.getElementById("progress-text").textContent =
    `進捗：${done} / ${total}`;
}
/******************************************************
 * ラウンド終了 → 採点
 ******************************************************/
async function finalizeRound() {
  // ★★ まず現在の問題の回答を強制取得・保存する（最重要）★★
  const q = currentRoundQuestions[currentIndex];
  const group = "q_" + q.id;
  const nodes = document.getElementsByName(group);

  const selected = [];
  nodes.forEach(n => { if (n.checked) selected.push(n.value); });

  answers[q.id] = selected.slice();

  // ★ 未回答チェック
  const unanswered = currentRoundQuestions.some(
    q => !answers[q.id] || answers[q.id].length === 0
  );
  if (unanswered) {
    showMessage("ご確認ください", "未回答の問題があります。回答してください。");
    return;
  }
  // ★ 採点時は問題カードを消す
  document.getElementById("question-area").innerHTML = "";

  // ★ 採点時に進捗を満タン（10/10）にする
  globalProgress = totalQuestions;
  updateProgressBar();

  const wrongList = [];

  // 全回答について採点
  currentRoundQuestions.forEach(q => {
    const selected = answers[q.id] || [];
    const correct  = q.answers.map(a => String(a));

    const ok =
      selected.length === correct.length &&
      selected.every(s => correct.includes(s));

    if (!ok) {
      wrongList.push(q);
    }
  });
  // ★★ 採点結果を GAS へ送信 ★★
  const payload = {
    name: userInfo.name,
    dept: userInfo.department,
    score: currentRoundQuestions.length - wrongList.length,
    total: currentRoundQuestions.length,
    attempt: userInfo.attempt,
    answers: answers,
    questionIds: currentRoundQuestions.map(q => q.id),
    timestamp: new Date().toISOString(),
    userAgent: navigator.userAgent
  };

  await saveResultToServer(payload);
  // 採点結果を表示
  showResultScreen(wrongList);

  // 履歴保存
  saveRoundHistory(currentRoundQuestions.length - wrongList.length,
                   currentRoundQuestions.length);

// ★ 採点時には attempt を増やさない
// if (wrongList.length > 0) {
//   userInfo.attempt++;
//   saveUserInfo();
// }

  // ★ 採点後は戻る/次へ非表示
  document.getElementById("back-btn").style.display = "none";
  document.getElementById("next-btn").style.display = "none";

  // ★ attempt 表示を更新
  document.getElementById("header-attempt").textContent =
    `第 ${userInfo.attempt} 回`;
}

/******************************************************
 * 結果画面の表示
 ******************************************************/
function showResultScreen(wrongList) {
  const área = document.getElementById("result-area");
  área.innerHTML = "";

  const score = currentRoundQuestions.length - wrongList.length;
  const total = currentRoundQuestions.length;

  const wrap = document.createElement("div");
  wrap.className = "card";
  wrap.style.marginTop = "12px";

  const h = document.createElement("h2");
  h.textContent = `結果：${score} / ${total}`;
  wrap.appendChild(h);

  // 誤答がある場合
  if (wrongList.length > 0) {
    const p = document.createElement("p");
    p.textContent = "間違えた問題：";
    wrap.appendChild(p);

    wrongList.forEach(q => {
      const div = document.createElement("div");
      div.style.fontSize = "0.9rem";
      div.style.marginLeft = "8px";

      const index = allQuestions.findIndex(x => String(x.id) === String(q.id)) + 1;
      div.textContent = `・Q${index}：${q.question}`;
      wrap.appendChild(div);
    });

    // もう一度挑戦ボタン
    const btn = document.createElement("button");
    btn.className = "btn-primary";
    btn.style.marginTop = "12px";
    btn.textContent = "誤答のみ再テスト";
btn.onclick = () => {
  // ★ 再テスト開始時に attempt++（正しい場所）
  userInfo.attempt++;
  saveUserInfo();

  // attempt 表示も更新
  document.getElementById("header-attempt").textContent =
    `第 ${userInfo.attempt} 回`;

  currentRoundQuestions = wrongList.slice();
  currentIndex = 0;

  document.getElementById("next-btn").style.display = "inline-flex";
  document.getElementById("back-btn").style.display = "none";

  renderQuestion();
  updateProgressBar();
  área.innerHTML = "";
  renderHistory();
};
    wrap.appendChild(btn);
  } else {
    const p = document.createElement("p");
    p.textContent = "全問正解です！ お疲れさまでした。";
    wrap.appendChild(p);
  }

  área.appendChild(wrap);
}

/******************************************************
 * ラウンド履歴保存（attempt = 1回ずつ）
 ******************************************************/
function saveRoundHistory(score, total) {
  const now = new Date();
  const ts =
    `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())} ` +
    `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;

  const attempt = userInfo.attempt;

  // attempt が重複していない時だけ push
  if (!userInfo.history.some(h => h.attempt === attempt)) {
    userInfo.history.push({
      attempt,
      score,
      total,
      timestamp: ts
    });
  }

  saveUserInfo();
  renderHistory();
}

/******************************************************
 * 履歴表示
 ******************************************************/
function renderHistory() {
  const area = document.getElementById("history-area");

  if (!userInfo.history.length) {
    area.style.display = "none";
    return;
  }

  area.style.display = "block";

  let html = "";
  userInfo.history.forEach(h => {
    html += `第${h.attempt}回：${h.score}/${h.total}（${h.timestamp}）<br>`;
  });

  area.innerHTML = html;
}

/******************************************************
 * 補助：2桁ゼロ埋め
 ******************************************************/
function pad2(n) {
  return n.toString().padStart(2, "0");
}

/******************************************************
 * GAS へ結果を送信して Results シートに追加する
 ******************************************************/
async function saveResultToServer(payload) {
  try {
    const res = await fetch(GAS_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (!data || data.status !== "success") {
      console.error("GAS 記録エラー", data);
      showMessage("エラー", "結果の保存に失敗しました。");
    }

  } catch (e) {
    console.error("GAS 通信エラー", e);
    showMessage("エラー", "結果送信時に通信エラーが発生しました。");
  }
}

/******************************************************
 * 🌟 カスタムメッセージモーダル
 ******************************************************/
function showMessage(title, message) {
  restoreMessageModal(); // ← これで常に正常なレイアウトに戻る

  document.getElementById("msg-title").textContent = title;
  document.getElementById("msg-body").textContent = message;

  document.getElementById("msg-modal").style.display = "flex";
}

document.getElementById("msg-btn").onclick = () => {
  document.getElementById("msg-modal").style.display = "none";
};
/******************************************************
 * 🌟 カスタム confirm（Yes/No）
 ******************************************************/
function showConfirm(title, message, onOk) {
  const modalBg = document.getElementById("msg-modal");
  const modalBox = modalBg.querySelector(".msg-modal");

  modalBox.innerHTML = `
    <div class="msg-title">${title}</div>
    <div class="msg-body">${message}</div>

    <div style="display:flex; gap:8px; margin-top: 16px;">
      <button class="msg-btn" id="confirm-ok"
        style="flex:1; background:#2563eb; color:white;">
        OK
      </button>

      <button class="msg-btn"
        id="confirm-cancel"
        style="flex:1; background:#e5e7eb; color:#111;">
        キャンセル
      </button>
    </div>
  `;

  modalBg.style.display = "flex";

  document.getElementById("confirm-ok").onclick = () => {
    modalBg.style.display = "none";
    onOk();
  };

  document.getElementById("confirm-cancel").onclick = () => {
    modalBg.style.display = "none";

    // confirm のあとも showMessage が
    // 使えるように元の close ボタンを復旧
    restoreMessageModal();
  };
}
function restoreMessageModal() {
  const modalBox = document.querySelector("#msg-modal .msg-modal");

  modalBox.innerHTML = `
    <div class="msg-title" id="msg-title">お知らせ</div>
    <div class="msg-body" id="msg-body"></div>
    <button class="msg-btn" id="msg-btn">閉じる</button>
  `;

  document.getElementById("msg-btn").onclick = () => {
    document.getElementById("msg-modal").style.display = "none";
  };
}
